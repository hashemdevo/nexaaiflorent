      body {
        background-color: rgb(var(--background));
        color: rgb(var(--on-surface));
        transition: background-color 0.2s ease, color 0.2s ease;
      }
      
      /* Ambient Background Glows */
      body::before {
        content: '';
        position: fixed;
        top: -20%;
        left: -10%;
        width: 60%;
        height: 60%;
        border-radius: 50%;
        background: radial-gradient(circle, var(--bg-glow-top), transparent 70%);
        z-index: -1;
        pointer-events: none;
        transition: background 0.3s ease;
      }
      
      body::after {
        content: '';
        position: fixed;
        bottom: -20%;
        right: -10%;
        width: 60%;
        height: 60%;
        border-radius: 50%;
        background: radial-gradient(circle, var(--bg-glow-bottom), transparent 70%);
        z-index: -1;
        pointer-events: none;
        transition: background 0.3s ease;
      }

      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgb(var(--surface-highlight)); border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: rgb(var(--border)); }

        box-shadow: 0 0 10px rgb(var(--primary));
      }
